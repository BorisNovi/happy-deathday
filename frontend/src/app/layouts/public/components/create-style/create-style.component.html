<div class="create-style">
  <h1 class="create-style__title">{{ 'createCard.step-2' | translate }}</h1>

  <div
    class="create-style__grid"
    role="radiogroup"
    [attr.aria-label]="'createCard.style.title' | translate"
  >
    @for (style of styles; track style) {
      <div class="create-style__card">
        <button
          class="create-style__card__btn"
          type="button"
          [class.create-style__card__btn--selected]="selectedStyle() === style"
          [attr.aria-pressed]="selectedStyle() === style"
          (click)="selectStyle(style)"
        >
          <img src="assets/images/card-style-{{ style }}.png" alt="card preview {{ style }}" class="create-style__card__preview">
        </button>
        <span class="create-style__card__label">{{ 'createCard.style.options.' + style | translate }}</span>
      </div>
    }
  </div>

  <div class="create-style__actions">
    <button tuiButton type="button" appearance="flat" size="m" (click)="back()">
      <tui-icon icon="@tui.chevron-left" />
      {{ 'common.back' | translate }}
    </button>
    <button tuiButton type="button" size="m" [disabled]="loading()" (click)="preview()">
      <tui-loader [loading]="loading()" [overlay]="true" [inheritColor]="true" size="s">
        {{ 'createCard.style.preview' | translate }}
      </tui-loader>
      <tui-icon icon="@tui.chevron-right" />
    </button>
  </div>
</div>
