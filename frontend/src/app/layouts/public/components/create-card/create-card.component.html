<div class="create-card">
  <p class="create-card__eyebrow" aria-hidden="true">☽ Happy Deathday</p>
  <h1 class="create-card__title">{{ 'createCard.title' | translate }}</h1>

  <div class="create-card__intro" role="note">
    <p>{{ 'createCard.intro.p1' | translate }}</p>
    <p>{{ 'createCard.intro.p2' | translate }}</p>
  </div>

  <hr class="create-card__divider" aria-hidden="true" />

  <form
    class="create-card__form"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    [attr.aria-label]="'createCard.form.ariaLabel' | translate"
  >
    <div class="create-card__field">
      <tui-textfield>
        <label tuiLabel for="recipientName">{{ 'createCard.form.name.label' | translate }}</label>
        <input
          id="recipientName"
          tuiInput
          type="text"
          formControlName="recipientName"
          [placeholder]="'createCard.form.name.placeholder' | translate"
          autocomplete="off"
        />
      </tui-textfield>
      <tui-error formControlName="recipientName" />
    </div>

    <div class="create-card__field">
      <tui-textfield>
        <label tuiLabel for="birthDate">{{ 'createCard.form.birthDate.label' | translate }}</label>
        <input
          id="birthDate"
          tuiInputDate
          formControlName="birthDate"
          [max]="maxDate"
        />
        <tui-calendar *tuiDropdown/>
      </tui-textfield>
      <tui-error formControlName="birthDate" />
    </div>

    <button
      tuiButton
      type="submit"
      size="l"
      [style.width.%]="100"
    >
      {{ 'createCard.form.submit' | translate }}
    </button>
  </form>
</div>
