@if (formData(); as data) {
  <div class="card-preview">
    <app-card-display
      [recipientName]="data.recipientName"
      [birthDate]="data.birthDate"
      [deathDate]="estimatedDeathDate()"
    />

    <div class="card-preview__actions">
      <button
        tuiButton
        type="button"
        appearance="outline"
        size="m"
        (click)="goBack()"
      >
        {{ 'common.back' | translate }}
      </button>

      <button
        tuiButton
        type="button"
        size="m"
        [disabled]="loading()"
        (click)="submit()"
      >
        @if (loading()) {
          {{ 'preview.saving' | translate }}
        } @else {
          {{ 'preview.share' | translate }}
        }
      </button>
    </div>

    <p class="card-preview__note">
      {{ 'preview.note' | translate }}
    </p>
  </div>
}
