<div class="card-page">
  @if (error()) {
    <p class="card-page__error" role="alert">{{ error() }}</p>
  } 
  @else if (card(); as c) {
    @if (birthDate(); as birth) {
      @if (deathDate(); as death) {
        <app-card-display
          [recipientName]="c.recipientName"
          [birthDate]="birth"
          [deathDate]="death"
        />
      }
    }
  } 
  @else {
    <p class="card-page__loading" aria-live="polite" aria-busy="true">Загружаем открытку…</p>
  }
</div>
